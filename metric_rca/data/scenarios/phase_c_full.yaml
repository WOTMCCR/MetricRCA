    {
      "scenario_id": "DG01_paid_ads_traffic_drop",
      "question": "Why did paid ads GMV drop on 2026-06-05?",
      "target_date": "2026-06-05",
      "metric_id": "gmv",
      "anomaly_direction": "drop",
      "expected_anomaly": true,
      "tags": [
        "campaign",
        "channel"
      ],
      "shocks": [
        {
          "shock_id": "paid-traffic",
          "shock_type": "paid_ads_traffic_drop",
          "selector": {
            "channel": [
              "paid_ads"
            ]
          },
          "operations": [
            {
              "field": "uv",
              "operation": "multiply",
              "value": 0.42,
              "day_offset": 0,
              "scope": "target"
            },
            {
              "field": "sessions",
              "operation": "multiply",
              "value": 0.42,
              "day_offset": 0,
              "scope": "target"
            },
            {
              "field": "orders",
              "operation": "multiply",
              "value": 0.42,
              "day_offset": 0,
              "scope": "target"
            }
          ]
        }
      ],
      "expected_causes": [
        {
          "root_cause_type": "campaign_traffic_drop",
          "dimension": "channel",
          "element": "paid_ads",
          "weight": 1.0,
          "expected_evidence_chain": [
            "E1",
            "E2_channel",
            "E3_campaign_traffic_drop",
            "E4_channel",
            "E_rank"
          ]
        }
      ],
      "negative_controls": [
        {
          "name": "organic-stable",
          "selector": {
            "channel": [
              "organic"
            ]
          },
          "metric_id": "gmv",
          "max_abs_delta_ratio": 0.14
        }
      ],
      "baseline_comparison": {
        "method": "prev_4_same_weekday",
        "offset_days": [
          -7,
          -14,
          -21,
          -28
        ],
        "minimum_effect_ratio": 0.3,
        "selector": {
          "channel": [
            "paid_ads"
          ]
        }
      }
    },
