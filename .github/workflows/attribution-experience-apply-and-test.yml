name: attribution-experience-apply-and-test

on:
  push:
    branches:
      - codex/ptv-attribution-experience-layer
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ hashFiles('.github/patches/plan_compiler_patch_1.py') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ptv-attribution-experience-layer
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply staged implementation
        run: |
          python .github/patches/support_patch.py
          python .github/patches/plan_compiler_patch_1.py
          python .github/patches/plan_compiler_patch_2.py
          python .github/patches/plan_compiler_patch_3.py
          python .github/patches/ranking_patch_1.py
          python .github/patches/ranking_patch_2.py
          python .github/patches/ranking_patch_3.py
          python .github/patches/ranking_patch_4.py
          python .github/patches/ranking_patch_5.py

      - name: Install project
        run: python -m pip install -e .

      - name: Compile
        run: python -m compileall -q metric_rca tests

      - name: Full pytest
        run: pytest -q

      - name: Commit verified implementation
        run: |
          rm -rf .github/patches
          rm -f .github/workflows/attribution-experience-apply-and-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate evidence-bounded attribution experience"
          git push origin HEAD:codex/ptv-attribution-experience-layer
