name: static-experience-priority-fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ptv-attribution-experience-layer
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply static priority fix
        run: python .github/patches/static_experience_priority_patch.py

      - name: Install project
        run: python -m pip install -e .

      - name: Compile and inspect
        run: |
          python -m compileall -q metric_rca tests
          git diff --check
          git status --short

      - name: Start MySQL and seed
        run: |
          docker compose up -d --wait mysql
          make seed ALLOW_DESTRUCTIVE_SEED=true

      - name: Full pytest
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-experience-priority-pytest
          path: pytest.log
          if-no-files-found: error
          retention-days: 3

      - name: Record Claude CLI availability
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude --version
          else
            echo 'CLAUDE_REVIEW_UNAVAILABLE: claude CLI is not installed on the GitHub runner'
          fi

      - name: Commit verified fix
        run: |
          rm -rf .github/patches
          rm -f .github/workflows/static-experience-priority-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: apply static attribution experience priority'
          git push origin HEAD:codex/ptv-attribution-experience-layer
