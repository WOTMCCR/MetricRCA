name: attribution-experience-review-fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ptv-attribution-experience-layer
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply review fix
        run: python .github/patches/policy_signal_patch.py

      - name: Install dependencies
        run: |
          python -m pip install -e .
          npm ci --prefix frontend

      - name: Compile and inspect
        run: |
          python -m compileall -q metric_rca tests
          git diff --check
          git status --short

      - name: Start MySQL and seed
        run: |
          docker compose up -d --wait mysql
          make seed ALLOW_DESTRUCTIVE_SEED=true

      - name: Run complete pytest suite
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attribution-experience-review-pytest
          path: pytest.log
          if-no-files-found: error
          retention-days: 3

      - name: Record Claude CLI availability
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude --version
          else
            echo 'CLAUDE_REVIEW_UNAVAILABLE: claude CLI is not installed on the GitHub runner'
          fi

      - name: Commit verified review fix
        run: |
          rm -f .github/patches/policy_signal_patch.py
          rmdir .github/patches 2>/dev/null || true
          rm -f .github/workflows/attribution-experience-review-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: keep signal typing in policy registry'
          git push origin HEAD:codex/ptv-attribution-experience-layer
