[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metric_rca"
version = "0.1.0"
description = "MetricRCA docs-compliant deterministic RCA system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "sqlalchemy==2.0.45",
  "pymysql==1.1.2",
  "sqlglot==25.34.1",
  "pandas==2.3.3",
  "openai-agents==0.17.5",
  "fastapi==0.124.2",
  "uvicorn==0.38.0",
  "httpx[socks]==0.28.1",
  "pytest==8.4.2",
  "pyyaml==6.0.3",
]

[tool.setuptools.packages.find]
include = ["metric_rca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
